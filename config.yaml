# Configuration for GNN-Based BERT Music Context Understanding
# Course: Neural Networks (CSE425 / EEE474 / CSE715)

project:
  name: "gnn-bert-music-context"
  seed: 42
  device: "auto"  # 'cuda', 'cpu', or 'auto'

# Audio Preprocessing Pipeline (Section 3 of PDF)
audio:
  sample_rate: 22050
  n_fft: 2048
  hop_length: 512
  n_mels: 128
  n_chroma: 12
  n_mfcc: 20
  segment_duration: 5.0  # seconds per segment
  similarity_threshold: 0.65  # tau for graph edges
  top_k_neighbors: 3

# Graph Configuration (Section 3 & 4.2 of PDF)
graph:
  type: "segment_similarity"  # "segment_similarity" or "chord_transition"
  node_feature_dim: 32       # combined pooled mel + chroma + mfcc per segment
  hidden_dim: 64
  out_dim: 64
  num_layers: 2
  gnn_type: "graphsage"       # "graphsage" or "gat"
  num_heads: 4                # for GAT
  dropout: 0.2
  readout: "mean"             # "mean", "sum", or "max"

# BERT Configuration (Section 4.1 of PDF)
bert:
  model_name: "distilbert-base-uncased"
  max_length: 128
  freeze_backbone: false
  embedding_dim: 768
  dropout: 0.2

# Fusion Model Configuration (Section 4.3 of PDF)
fusion:
  fusion_type: "cross_attention"  # "cross_attention", "early_concat", "bert_only", "gnn_only"
  hidden_dim: 128
  num_attention_heads: 4
  dropout: 0.3
  alpha_valence: 0.5  # weight for valence regression loss
  beta_arousal: 0.5   # weight for arousal regression loss

# Contrastive Dual-Encoder Configuration (Section 4.4 of PDF)
contrastive:
  projection_dim: 128
  temperature: 0.07   # tau in InfoNCE loss
  learning_rate: 1.0e-4

# Training Parameters (Optimal Production Configuration)
training:
  batch_size: 16
  epochs: 15
  learning_rate: 1.0e-4
  bert_learning_rate: 3.0e-5
  gnn_learning_rate: 5.0e-4
  fusion_learning_rate: 1.0e-4
  contrastive_learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  scheduler_patience: 3
  scheduler_factor: 0.5
  early_stopping_patience: 5

# Data Splits and Paths
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  num_classes: 25  # multi-label tags (genre, mood, instrument)

# Output Paths
outputs:
  results_dir: "results"
  plots_dir: "results/plots"
  retrieval_dir: "results/retrieval_examples"
  report_dir: "report"
